<VirtualHost *:80>
    ServerName crm.test
    DocumentRoot "D:/Projects/crm-portal/public"
    <Directory "D:/Projects/crm-portal/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerName crm.test
    DocumentRoot "D:/Projects/crm-portal/public"
    SSLEngine on
    SSLCertificateFile "D:/DevBox/data/devbox-cert.pem"
    SSLCertificateKeyFile "D:/DevBox/data/devbox-key.pem"
    <Directory "D:/Projects/crm-portal/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
