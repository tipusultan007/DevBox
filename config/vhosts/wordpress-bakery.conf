<VirtualHost *:80>
    ServerName undefined
    DocumentRoot "D:/Projects/wordpress-bakery"
    <Directory "D:/Projects/wordpress-bakery">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerName undefined
    DocumentRoot "D:/Projects/wordpress-bakery"
    SSLEngine on
    SSLCertificateFile "D:/DevBox/data/devbox-cert.pem"
    SSLCertificateKeyFile "D:/DevBox/data/devbox-key.pem"
    <Directory "D:/Projects/wordpress-bakery">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
