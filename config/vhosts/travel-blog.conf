<VirtualHost *:80>
    ServerName travel.test
    DocumentRoot "D:/Projects/travel-blog"
    <Directory "D:/Projects/travel-blog">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
<VirtualHost *:443>
    ServerName travel.test
    DocumentRoot "D:/Projects/travel-blog"
    SSLEngine on
    SSLCertificateFile "D:/DevBox/data/devbox-cert.pem"
    SSLCertificateKeyFile "D:/DevBox/data/devbox-key.pem"
    <Directory "D:/Projects/travel-blog">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
